version: "3"

services:
  mcp-server:
    user: "${UID}:${GID}"
    # Development: build from local context
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-server-dev
    volumes:
      # Mount the current directory to /workspace
      - ./:/workspace
    environment:
      # Set workspace root to mounted volume
      - WORKSPACE_ROOT=/workspace
      - FASTEDGE_API_KEY=${FASTEDGE_API_KEY:-default_key}
    # For stdio transport, we use tty and stdin_open
    tty: true
    stdin_open: true
    # If you want to expose the server to other services, uncomment:
    # ports:
    #  - "3000:3000"
