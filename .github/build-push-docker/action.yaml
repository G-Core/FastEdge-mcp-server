name: "Build and push Docker Image"
description: "Build and push Docker image to ghcr.io"
inputs:
  github_token:
    description: "GitHub token for auth"
    required: true
  tag_version:
    description: "tag version" # tag version e.g. v0.1.5
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Set environment variables
      shell: bash
      run: |
        echo "REGISTRY=ghcr.io" >> $GITHUB_ENV
        echo "IMAGE_NAME=g-core/fastedge-mcp-server" >> $GITHUB_ENV
        echo "BASE_IMAGE_NAME=g-core/fastedge-mcp-server-base" >> $GITHUB_ENV

    - name: Extract Docker Tag version
      shell: bash
      id: extract_version
      # Inputs reach the shell as environment variables, never pasted into the script (review C1).
      env:
        TAG_VERSION: ${{ inputs.tag_version }}
      run: |
        [[ "$TAG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]] || { echo "Invalid tag: $TAG_VERSION" >&2; exit 1; }
        DOCKER_TAG_VERSION=${TAG_VERSION#v}  # Remove the 'v' prefix
        echo "DOCKER_TAG_VERSION: $DOCKER_TAG_VERSION"
        echo "DOCKER_TAG_VERSION=$DOCKER_TAG_VERSION" >> $GITHUB_ENV
        echo "DOCKER_TAG_VERSION=$DOCKER_TAG_VERSION" >> $GITHUB_OUTPUT

    - name: Update package.json version
      shell: bash
      env:
        VERSION: ${{ steps.extract_version.outputs.DOCKER_TAG_VERSION }}
      run: |
        jq --arg version "$VERSION" '.version = $version' package.json > package.tmp.json
        mv package.tmp.json package.json

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Log in to Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ steps.extract_version.outputs.DOCKER_TAG_VERSION }}
          # Pre-releases (vX.Y.Z-N) publish their own tag only; never move latest, which every plugin user pulls.
          type=raw,value=latest,enable=${{ !contains(inputs.tag_version, '-') }}

    - name: Build and push Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
