name: "Build and push Docker Image"
description: "Build and push Docker image to ghcr.io"
inputs:
  github_token:
    description: "GitHub token for auth"
    required: true
  tag_version:
    description: "tag version" # docker tag version e.g. v0.1.5
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Set environment variables
      shell: bash
      run: |
        echo "REGISTRY=ghcr.io" >> $GITHUB_ENV
        echo "IMAGE_NAME=g-core/fastedge-mcp-server" >> $GITHUB_ENV
        echo "BASE_IMAGE_NAME=g-core/fastedge-mcp-server-base" >> $GITHUB_ENV

    - name: Extract Docker Tag version
      shell: bash
      id: extract_version
      run: |
        DOCKER_TAG_VERSION=${{ inputs.tag_version }}
        DOCKER_TAG_VERSION=${DOCKER_TAG_VERSION#v}  # Remove the 'v' prefix
        echo "DOCKER_TAG_VERSION: $DOCKER_TAG_VERSION"
        echo "DOCKER_TAG_VERSION=$DOCKER_TAG_VERSION" >> $GITHUB_ENV
        echo "DOCKER_TAG_VERSION=$DOCKER_TAG_VERSION" >> $GITHUB_OUTPUT

    - name: Update package.json version
      shell: bash
      run: |
        jq --arg version "${{ steps.extract_version.outputs.DOCKER_TAG_VERSION }}" '.version = $version' package.json > package.tmp.json
        mv package.tmp.json package.json

    - name: DEBUG Docker Tag version
      shell: bash
      run: |
        echo "Docker DOCKER_TAG_VERSION: ${{ steps.extract_version.outputs.DOCKER_TAG_VERSION }}"
        echo "REGISTRY: ${{ env.REGISTRY }}"
        echo "IMAGE_NAME: ${{ env.IMAGE_NAME }}"
        echo "BASE_IMAGE_NAME: ${{ env.BASE_IMAGE_NAME }}"

    - name: Update base image reference after build
      if: steps.check_base_image.outputs.base_exists == 'false'
      shell: bash
      run: |
        echo "BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ steps.extract_version.outputs.DOCKER_TAG_VERSION }}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BASE_IMAGE=${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
