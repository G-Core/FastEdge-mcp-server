name: "Download Context 7 Docs"
description: "Download and generate docs for latest Context7 content"
inputs:
  context7_apikey:
    description: "Context7 API key for documentation generation"
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - name: Setup Node.js latest
      uses: actions/setup-node@v4
      with:
        node-version: 23.x

    - name: Install dependencies
      shell: bash
      run: |
        npm ci

    - name: Generate Context7 Docs
      shell: bash
      run: |
        export CONTEXT7_APIKEY=${{ inputs.context7_apikey }} &&
        npm run create:docs
