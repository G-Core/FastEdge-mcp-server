name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/setup-node

      - name: Build server
        run: pnpm run build:server

      - name: Run tests
        run: pnpm test
