name: Create a versioned release

on:
  push:
    tags:
      - "v[0-9]+.*"

  workflow_dispatch: # trigger manually
    inputs:
      tag_version:
        description: "Release tag e.g. v1.0.1"
        required: true
        default: ""

jobs:
  # fossa:
  #   uses: ./.github/workflows/fossa.yaml
  #   secrets: inherit

  create_docker_release:
    # needs: fossa
    runs-on: [self-hosted, ubuntu-22-04, regular]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate App token
        if: github.event_name == 'workflow_dispatch'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.FASTEDGE_APP_ID }}
          private-key: ${{ secrets.FASTEDGE_APP_PRIVATE_KEY }}
          repositories: FastEdge-mcp-server

      - name: Checkout this repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Create release tag
        id: determine-tag
        run: |
          if [ -n "${{ github.event.inputs.tag_version }}" ]; then
            TAG_VERSION="${{ github.event.inputs.tag_version }}"
            if [[ ! "$TAG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
              echo "Invalid tag format: $TAG_VERSION"
              exit 1
            fi
            # Set up auth and identity before any remote operation (ls-remote or push).
            GH_TOKEN="${{ steps.app-token.outputs.token }}" gh auth setup-git
            git config user.name "fastedge-plugin-sync[bot]"
            git config user.email "fastedge-plugin-sync[bot]@users.noreply.github.com"
            if git ls-remote --tags origin "refs/tags/$TAG_VERSION" | grep -q "$TAG_VERSION"; then
              echo "Tag $TAG_VERSION already exists on remote — using it"
            else
              echo "Creating new release tag: $TAG_VERSION"
              git tag -a "$TAG_VERSION" -m "Release $TAG_VERSION"
              git push origin "$TAG_VERSION"
            fi
            echo "has_tag=true" >> $GITHUB_OUTPUT
            echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          else
            TAG_VERSION=${GITHUB_REF#refs/tags/}
            if [[ ! "$TAG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
              echo "Invalid tag format: $TAG_VERSION"
              exit 1
            fi
            echo "has_tag=true" >> $GITHUB_OUTPUT
            echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          fi

      - name: Debug release tag
        if: ${{ steps.determine-tag.outputs.has_tag == 'true' }}
        run: |
          echo "Release tag created successfully: ${{ env.TAG_VERSION }}"

      - name: Build and push Docker Image
        if: ${{ steps.determine-tag.outputs.has_tag == 'true' }}
        id: build-and-push
        uses: ./.github/build-push-docker
        with:
          tag_version: ${{ env.TAG_VERSION }}
          github_token: ${{ github.token }}
