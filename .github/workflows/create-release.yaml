name: Create a versioned release

on:
  push:
    tags:
      - "v[0-9]+.*"

  workflow_dispatch: # trigger manually
    inputs:
      tag_version:
        description: "Release tag e.g. v1.0.1"
        required: true
        default: ""

jobs:
  # fossa:
  #   uses: ./.github/workflows/fossa.yaml
  #   secrets: inherit

  create_docker_release:
    # needs: fossa
    runs-on: [self-hosted, ubuntu-22-04, regular]
    # Publishing needs an approval (review C3). Configure required reviewers in the repository's
    # Settings → Environments → release; without them GitHub creates the environment unprotected.
    environment: release

    permissions:
      contents: read
      packages: write

    steps:
      - name: Generate App token
        if: github.event_name == 'workflow_dispatch'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.FASTEDGE_APP_ID }}
          private-key: ${{ secrets.FASTEDGE_APP_PRIVATE_KEY }}
          repositories: FastEdge-mcp-server

      - name: Checkout this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.12.0"

      - name: Create release tag
        id: determine-tag
        # Inputs and the token reach the shell as environment variables, never pasted into the
        # script (review C1). An existing tag must point at the commit being built (review C2).
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          valid() { [[ "$1" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG_VERSION="$INPUT_TAG"
            valid "$TAG_VERSION" || { echo "Invalid tag format: $TAG_VERSION" >&2; exit 1; }
            # Set up auth and identity before any remote operation (ls-remote or push).
            gh auth setup-git
            git config user.name "fastedge-plugin-sync[bot]"
            git config user.email "fastedge-plugin-sync[bot]@users.noreply.github.com"
            # An annotated tag lists the tag object first and its commit on the "^{}" line: compare
            # the commit (the peeled line), or the plain ref for a lightweight tag.
            REFS="$(git ls-remote --tags origin "refs/tags/$TAG_VERSION" "refs/tags/$TAG_VERSION^{}")"
            TAGGED="$(awk -v t="refs/tags/$TAG_VERSION^{}" '$2==t{print $1}' <<<"$REFS")"
            [ -n "$TAGGED" ] || TAGGED="$(awk -v t="refs/tags/$TAG_VERSION" '$2==t{print $1}' <<<"$REFS")"
            if [ -n "$TAGGED" ]; then
              HEAD_SHA="$(git rev-parse HEAD)"
              if [ "$TAGGED" != "$HEAD_SHA" ]; then
                echo "Tag $TAG_VERSION already exists at $TAGGED, but this run checked out $HEAD_SHA. Run the release from that tag, or use a new version." >&2
                exit 1
              fi
              echo "Tag $TAG_VERSION already exists at this commit — using it"
            else
              echo "Creating new release tag: $TAG_VERSION"
              git tag -a "$TAG_VERSION" -m "Release $TAG_VERSION"
              git push origin "$TAG_VERSION"
            fi
          else
            TAG_VERSION="$REF_NAME"
            valid "$TAG_VERSION" || { echo "Invalid tag format: $TAG_VERSION" >&2; exit 1; }
          fi
          echo "has_tag=true" >> "$GITHUB_OUTPUT"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Debug release tag
        if: ${{ steps.determine-tag.outputs.has_tag == 'true' }}
        run: |
          echo "Release tag created successfully: $TAG_VERSION"

      # The token-broker release gate (SECURITY.md, DEVELOPMENT.md): the image this commit builds
      # must pass the container isolation checks before anything is published (review C3).
      - name: Token broker isolation gate
        if: ${{ steps.determine-tag.outputs.has_tag == 'true' }}
        run: |
          docker build -t fastedge-mcp-server:release-gate .
          bash scripts/tests/test-broker-isolation.sh fastedge-mcp-server:release-gate

      - name: Build and push Docker Image
        if: ${{ steps.determine-tag.outputs.has_tag == 'true' }}
        id: build-and-push
        uses: ./.github/build-push-docker
        with:
          tag_version: ${{ env.TAG_VERSION }}
          github_token: ${{ github.token }}
