# sync-and-release.yml — Auto-sync reference docs and release.
#
# Triggered by fastedge-plugin's release-plugin.yml workflow via
# repository_dispatch. Syncs reference docs from the plugin release tag,
# bumps package.json to match the plugin version, commits to main,
# tags, and pushes. The tag push triggers create-release.yaml which
# builds and publishes the Docker image.
#
# All three consumers (Claude plugin, Codex plugin, MCP server) share
# the same version number after each release.
#
# Can also be triggered manually for testing or re-syncing.

name: Sync Docs and Release

on:
  repository_dispatch:
    types: [plugin-release]
  workflow_dispatch:
    inputs:
      plugin_ref:
        description: "fastedge-plugin ref to sync from (tag or branch) e.g. v0.1.7 or main"
        type: string
        required: false
        default: "main"
      version:
        description: "Version to set (leave empty to skip version bump) e.g. 0.1.7"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-and-release
  cancel-in-progress: false

jobs:
  sync-and-release:
    runs-on: [self-hosted, ubuntu-22-04, regular]
    steps:
      - name: Checkout MCP server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.12.0"

      - name: Resolve inputs
        id: inputs
        # Payload and inputs reach the shell as environment variables, never pasted into the
        # script, and are validated before any later step uses them (review C1).
        env:
          IN_REF: ${{ github.event.client_payload.tag || inputs.plugin_ref || 'main' }}
          IN_VERSION: ${{ github.event.client_payload.version || inputs.version || '' }}
        run: |
          # Prefer dispatch payload, fall back to workflow_dispatch inputs.
          REF="$IN_REF"
          VERSION="$IN_VERSION"
          [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ ]] || { echo "Invalid plugin ref: $REF" >&2; exit 1; }
          # Same grammar create-release accepts for the v<version> tag it will be triggered by.
          [ -z "$VERSION" ] || [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]] || { echo "Invalid version: $VERSION" >&2; exit 1; }
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Syncing from fastedge-plugin ref: ${REF}, version: ${VERSION}"

      # repository_dispatch: download + verify tarball from GitHub Release.
      - name: Generate token for fastedge-plugin access
        id: plugin-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.FASTEDGE_APP_ID }}
          private-key: ${{ secrets.FASTEDGE_APP_PRIVATE_KEY }}
          repositories: fastedge-plugin, FastEdge-mcp-server

      - name: Sync from release artifact (repository_dispatch)
        if: github.event_name == 'repository_dispatch'
        env:
          GITHUB_TOKEN: ${{ steps.plugin-token.outputs.token }}
          ARTIFACT_URL: ${{ github.event.client_payload.artifact_url }}
          SHA256_URL: ${{ github.event.client_payload.artifact_sha256_url }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          # Only release assets of the plugin repo (review C1).
          for u in "$ARTIFACT_URL" "$SHA256_URL"; do
            [[ "$u" =~ ^https://github\.com/G-Core/fastedge-plugin/releases/download/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid artifact URL: $u" >&2; exit 1; }
          done
          bash scripts/sync-from-artifact.sh \
            --artifact-url "$ARTIFACT_URL" \
            --sha256-url   "$SHA256_URL" \
            --version      "$VERSION"

      # workflow_dispatch: sparse checkout at the given ref (dev/testing path).
      - name: Sparse checkout fastedge-plugin (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          PLUGIN_TOKEN: ${{ steps.plugin-token.outputs.token }}
          REF: ${{ steps.inputs.outputs.ref }}
        run: |
          rm -rf /tmp/fastedge-plugin
          git clone --depth 1 --sparse --branch "$REF" \
            "https://x-access-token:${PLUGIN_TOKEN}@github.com/G-Core/fastedge-plugin.git" /tmp/fastedge-plugin
          cd /tmp/fastedge-plugin
          git sparse-checkout set \
            plugins/gcore-fastedge/skills/fastedge-docs/reference \
            plugins/gcore-fastedge/skills/test/reference \
            plugins/gcore-fastedge/docs-index.json

      - name: Sync reference docs (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: PLUGIN_PATH=/tmp/fastedge-plugin bash scripts/sync-reference-docs.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No doc changes — skipping release."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version to match plugin release
        if: steps.changes.outputs.changed == 'true' && steps.inputs.outputs.version != ''
        env:
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp \
            && mv package.json.tmp package.json
          echo "Set package.json version to ${VERSION}"

      - name: Configure git credentials
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.plugin-token.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/G-Core/FastEdge-mcp-server.git"
          git config user.name "fastedge-plugin-sync[bot]"
          git config user.email "fastedge-plugin-sync[bot]@users.noreply.github.com"

      - name: Commit, tag, and push
        if: steps.changes.outputs.changed == 'true'
        id: commit
        env:
          REF: ${{ steps.inputs.outputs.ref }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |

          git add reference-docs/ package.json

          if [ -n "$VERSION" ]; then
            BRANCH="release/v${VERSION}"
            git checkout -B "$BRANCH"
            git commit -m "release: v${VERSION} — sync reference docs from fastedge-plugin ${REF}"
            git tag -a "v${VERSION}" -m "Release v${VERSION} (synced from fastedge-plugin ${REF})"
            git push origin "$BRANCH" --follow-tags
            echo "Tagged and pushed v${VERSION} on ${BRANCH}"
          else
            BRANCH="docs/sync-$(date +%Y%m%d-%H%M%S)"
            git checkout -B "$BRANCH"
            git commit -m "docs: sync reference docs from fastedge-plugin ${REF}"
            git push origin "$BRANCH"
            echo "Pushed docs sync on ${BRANCH}"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.inputs.outputs.ref }}
          VERSION: ${{ steps.inputs.outputs.version }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |

          if [ -n "$VERSION" ]; then
            TITLE="release: v${VERSION}"
            BODY="Automated sync — reference docs from fastedge-plugin ${REF}. Approve to land on main."
          else
            TITLE="docs: sync reference docs from fastedge-plugin ${REF}"
            BODY="Manual reference doc sync from fastedge-plugin ${REF}. Approve to land on main."
          fi

          gh pr create \
            --title "$TITLE" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH"
